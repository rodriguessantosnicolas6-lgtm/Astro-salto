const snap=v=>Math.round(v/2)*2;
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function post(){
  const w=buf.width,h=buf.height,id=ctx.getImageData(0,0,w,h),d=id.data,N=11,step=255/N;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,t=(BAYER[(y&3)*4+(x&3)]/16-.5)*step*.85;
    d[i]=Math.round((d[i]+t)/step)*step;d[i+1]=Math.round((d[i+1]+t)/step)*step;d[i+2]=Math.round((d[i+2]+t)/step)*step;
  }
  ctx.putImageData(id,0,0);
  out.imageSmoothingEnabled=false;
  out.drawImage(buf,0,0,W,H);
}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}

function beep(f,d,type='square',v=.05,sl=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
const sfx={jump:()=>beep(320,.18,'square',.05,380),coin:()=>{beep(880,.08,'triangle',.07);setTimeout(()=>beep(1320,.12,'triangle',.07),70)},kill:()=>beep(200,.15,'sawtooth',.06,-120),hurt:()=>beep(220,.4,'sawtooth',.07,-170),bump:()=>beep(140,.08,'square',.06),life:()=>{[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.07),i*90))},win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.07),i*160))}};

addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();if(k==='jump'&&!keys.jump){keys.edge=1;action()}keys[k]=1}else if(e.key==='Enter')action()});

/*GEN_START*/
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function tryGen(R,diff,th,name){
  const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const nseg=8,segs=[],gaps=[];let x=0;
  for(let i=0;i<nseg;i++){
    const len=i===0?16:i===nseg-1?18:ri(12,17);
    segs.push([x,x+len]);
    if(i<nseg-1){const g=R()<Math.min(.85,.3+.12*diff)?4:3;gaps.push(g);x+=len+g}
  }
  const end=segs[nseg-1][1];
  const skip=ri(0,5),sites=[1,2,3,4,5,6].filter((_,i)=>i!==skip);
  const plats=[],pillars=[],frags=[],spans=[],dz={};
  sites.forEach(si=>{
    const [a,b]=segs[si],len=b-a;
    const opts=['A','D'];if(len>=13)opts.push('B');
    const t=opts[ri(0,opts.length-1)];
    if(t==='A'){const c=ri(a+3,b-8);plats.push([c,8,3],[c+3,5,3]);frags.push([(c+4)*T+16,138]);spans.push([c,c+5])}
    else if(t==='B'){const c=ri(a+3,b-10);plats.push([c,8,3],[c+3,6,2],[c+5,4,3]);frags.push([(c+6)*T+16,106]);spans.push([c,c+7])}
    else{const g=gaps[si];pillars.push([b-2,2]);frags.push([(b+g/2)*T,158]);spans.push([b-2,b+g]);dz[si]=true}
  });
  const siteSet=new Set(sites);
  for(let i=0;i<nseg;i++){
    if(siteSet.has(i))continue;
    const [a,b]=segs[i];
    if(i===0)plats.push([7,8,3]);
    else if(i===nseg-1)plats.push([a+4,8,3]);
    else{const c=ri(a+3,b-8);plats.push([c,8,3]);if(R()<.5)plats.push([c+3,5,3])}
  }
  for(let i=0;i<nseg;i++){
    if(dz[i])continue;
    const [a,b]=segs[i];
    if(R()<.75){
      for(let k=0;k<8;k++){
        const lo=i===0?a+6:a+4,hi=i===nseg-1?b-8:b-6;
        const p=ri(lo,hi);
        if(plats.some(([c,r,n])=>!(p+1<=c-2||p>=c+n+1)))continue;
        pillars.push([p,diff>=2&&R()<.5?3:2]);break;
      }
    }
  }
  const en=[];
  for(let i=0;i<nseg;i++){
    const [a,b]=segs[i],len=b-a;
    const cnt=1+(diff>=2&&len>=14?1:0)+(diff>=4&&len>=16?1:0);
    for(let k=0;k<cnt;k++)for(let tr=0;tr<10;tr++){
      let lo=a+2,hi=b-3;if(i===0)lo=a+9;if(dz[i])hi=b-7;if(i===nseg-1)hi=b-8;
      const c=ri(lo,hi);
      if(pillars.some(([p])=>c>=p-1&&c<=p+2))continue;
      if(en.some(e=>Math.abs(e-c)<4))continue;
      en.push(c);break;
    }
  }
  en.sort((p,q)=>p-q);
  const K=Math.min(16,5+2*diff),clouds=[];
  for(let tr=0;tr<300&&clouds.length<K;tr++){
    const c=ri(10,end-4);
    if(spans.some(([lo,hi])=>c>=lo-4&&c<=hi+4))continue;
    if(clouds.some(o=>Math.abs(o-c)<5))continue;
    clouds.push(c);
  }
  clouds.sort((p,q)=>p-q);
  const gc=[];
  segs.forEach(([a,b])=>{for(const c of [a+2,a+5,a+7]){if(c+2>b-3)continue;if(pillars.some(([p])=>!(c+2<p-1||c>p+2)))continue;gc.push([c,10,3]);break}});
  return{name,th,end,goal:end-2,cp:segs[4][0]+1,diff,segs,plats,pillars,gc,en,clouds,frags};
}
function validLevel(L){
  if(L.frags.length!==5)return false;
  for(const [fx] of L.frags)for(const c of L.clouds)if(Math.abs(fx-(c*T+16))<150)return false;
  for(let i=0;i<L.plats.length;i++)for(let j=i+1;j<L.plats.length;j++){
    const [c1,r1,n1]=L.plats[i],[c2,r2,n2]=L.plats[j];
    if(r1===r2&&c1<c2+n2&&c2<c1+n1)return false;
  }
  for(const [p] of L.pillars)if(!L.segs.some(([a,b])=>p>=a&&p+2<=b))return false;
  for(const c of L.en)if(!L.segs.some(([a,b])=>c>=a&&c<b))return false;
  return true;
}
function genLevel(seed,diff,th,name){
  for(let at=0;at<80;at++){
    const L=tryGen(rng(seed*131+at*7+1),diff,th,name);
    if(validLevel(L))return L;
  }
  return Object.assign({},LV[1],{name,th,diff});
}
const WORLDS=[

 [['Planeta Orquídea',320,2],['Planeta Tormenta',230,3],['Planeta Âmbar',45,3],['Planeta Eclipse',265,4]],
 [['Planeta Aurora',165,3],['Planeta Ferrugem',15,4],['Planeta Coral',350,4],['Planeta Cosmos',250,5]]
];
const ARENAS=[
 {name:'Ninho Azul',hue:205,boss:'chick2',plats:[[3,8,3],[9,8,2],[13,6,3],[18,8,3],[22,6,3],[26,8,2]]},
 {name:'Ninho Vermelho',hue:0,boss:'chick3',plats:[[4,8,3],[8,6,3],[13,8,2],[17,5,4],[23,8,2],[26,6,2]]},
 {name:'Trono do Rei Pato',hue:95,boss:'duck',plats:[[2,8,3],[5,6,3],[10,6,3],[16,5,3],[22,6,3],[26,6,2]],theme:{sky:['#040904','#10261a','#2c5a2a'],mt:['#2a1a3a','#1a102a'],pl:['#8aff3c','rgba(0,0,0,.35)','rgba(180,255,120,.5)'],g0:'#3a4a3a',gt:'#5a7a4a',gh:'#8aaa6a',gb:'#252d25',pil:'#4a4a3a',pilT:'#6a8a4a'}}

WORLDS.forEach((w,wi)=>{
  w.forEach(([name,hue,diff],i)=>{TH.push(themeFromHue(hue));LV.push(genLevel(1000+wi*50+i*7,diff,TH.length-1,name))});
  const A=ARENAS[wi];TH.push(A.theme||themeFromHue(A.hue));
  LV.push({name:A.name,th:TH.length-1,end:32,goal:29,cp:-1,boss:A.boss,diff:0,segs:[[0,32]],plats:A.plats,pillars:[],gc:[[7,10,3],[19,10,3]],en:[],clouds:[],frags:[]});
});
/*GEN_END*/

let lv=0,L=LV[0],TM=TH[0],LW=0,LEND=0,GOALX=0;
let solids,coins,enemies,parts,clouds,drops,lasers,bullets,globs,birds,frags,total,boss,bossDead=false,fragCount=0,msgS='',gem=null,goldT=0,hb=null;

let state='title',tick=0,cam=0,lives=3,got=0,cp,cpOn=false,launchT=0,msgT=0,fireCd=0,shootT=0,introT=0,fuel=100,canJet=false,jet=false,stuck=0;

function init(li,lifeVal){
  lv=li;L=LV[li];TM=TH[L.th];LEND=L.end*T;LW=(L.end+2)*T;GOALX=L.goal*T;
  solids=[];coins=[];enemies=[];parts=[];drops=[];lasers=[];bullets=[];globs=[];birds=[];boss=null;bossDead=false;gem=null;goldT=0;hb=null;
  L.segs.forEach(([a,b])=>solids.push({x:a*T,y:GY,w:(b-a)*T,h:3*T,k:'g'}));
  L.plats.forEach(([c,r,n])=>{solids.push({x:c*T,y:r*T,w:n*T,h:T,k:'p'});for(let i=0;i<n;i++)coins.push({x:(c+i)*T+16,y:r*T-20})});
  L.pillars.forEach(([c,h])=>solids.push({x:c*T,y:GY-h*T,w:2*T,h:h*T,k:'r'}));
  L.gc.forEach(([c,r,n])=>{for(let i=0;i<n;i++)coins.push({x:(c+i)*T+16,y:r*T+16})});
  for(let g=0;g<L.segs.length-1;g++){const a=L.segs[g][1],b=L.segs[g+1][0],n=b-a;for(let i=0;i<n;i++){const row=9-Math.round(Math.sin(Math.PI*(i+.5)/n)*2);coins.push({x:(a+i)*T+16,y:row*T+16})}}
  L.en.forEach((c,i)=>enemies.push({x:c*T,y:GY-90,w:30,h:24,vx:(i%2?-1:1)*(.7+(c%3)*.15+(L.diff||0)*.06),vy:0,dead:0,t:0,hop:60+(c*7)%80,onG:false}));
  total=coins.length;
  {
    const mid=L.end/2;let best=null;
    for(const [a,b] of L.segs){
      for(let c=a+(a===0?6:4);c<=b-6;c++){

const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(b){
  let hitX=0,onG=false,head=null;
  b.x+=b.vx;
  for(const s of solids){if(ov(b,s)){if(b.vx>0){b.x=s.x-b.w;hitX=1}else if(b.vx<0){b.x=s.x+s.w;hitX=-1}}}
  b.y+=b.vy;
  for(const s of solids){if(ov(b,s)){if(b.vy>0){b.y=s.y-b.h;onG=true}else if(b.vy<0){b.y=s.y+s.h;head=s}b.vy=0}}
  return{hitX,onG,head};
}
function burst(x,y,c,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,t:30,c})}

function respawn(){P.x=cp.x;P.y=cp.y;P.vx=0;P.vy=0;P.inv=110;stuck=0}
function hurt(pit){
  if(goldT>0)return;
  if(P.inv>0&&!pit)return;
  lives--;sfx.hurt();
  if(lives<=0){state='over';return}
  if(pit)respawn();else{P.vy=-6;P.vx=-P.face*4;P.inv=110}
}
function stickGlob(){
  if(goldT>0||P.inv>0)return;
  lives--;sfx.hurt();stuck=220;P.inv=60;msgS='Gosma! Aperte pular várias vezes para se soltar';msgT=150;
  if(lives<=0){state='over'}
}
function hitBoss(n){
  boss.hp-=n;boss.flash=8;beep(180,.08,'square',.06);burst(boss.x+boss.w/2,boss.y+boss.h/2,'#ffe14a',8);

function startGold(){
  goldT=1200;P.inv=0;stuck=0;fuel=100;jet=false;
  for(let k=0;k<20;k++)burst(P.x+P.w/2,P.y+P.h/2,`hsl(${k*18},100%,60%)`,1);

}
function bossShoot(){
  const cfg=boss.cfg,f=boss.face,rage=boss.hp<=boss.max/2;
  if(cfg.kind==='duck'){
    const gx=boss.x+boss.w/2+f*62,gy=boss.y+boss.h-34;
    const ang=Math.atan2((P.y+P.h/2)-gy,(P.x+P.w/2)-gx);

    boss.fl=8;beep(150,.25,'sawtooth',.06,120);return;
  }
  const gx=boss.x+boss.w/2+f*52,gy=boss.y+boss.h-26;
  const ang=Math.atan2((P.y+P.h/2)-gy,(P.x+P.w/2)-gx);
  const n=rage?cfg.rn:cfg.n,sp=rage?cfg.rbs:cfg.bs;
  for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*cfg.step;bullets.push({x:gx,y:gy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:cfg.bc})}

  if(L.cp<=0)return;
  const x=L.cp*T;ctx.fillStyle='#d6dcff';ctx.fillRect(x,GY-60,4,60);
  ctx.fillStyle=cpOn?'#5ff58a':'#ff5a4e';ctx.beginPath();ctx.moveTo(x+4,GY-60);ctx.lineTo(x+26,GY-52);ctx.lineTo(x+4,GY-44);ctx.fill();
}
function txt(s,x,y,size,col,al='center',stroke='#1b0b3a'){ctx.font=`bold ${size}px "Courier New",Courier,monospace`;ctx.textAlign=al;ctx.lineWidth=Math.max(3,size/6);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function hud(){
  ctx.save();ctx.translate(26,26);ctx.fillStyle='#5ff5e8';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(8,0);ctx.lineTo(0,11);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  txt(`${got}/${total}`,44,33,20,'#fff5e6','left');
  const helmet=(x,y)=>{ctx.fillStyle='#fafaff';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();ctx.fillStyle='#ff8a4a';ctx.beginPath();ctx.ellipse(x+3,y,6,5,0,0,7);ctx.fill();ctx.strokeStyle='#1b0b3a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.stroke()};
  for(let i=0;i<lives;i++)helmet(28+i*26,60);
  txt(`Fase ${lv+1}/${LV.length}`,18,92,16,'#ffe07a','left');
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(18,100,96,10);ctx.fillStyle=fuel<25?'#ff5a4e':'#ffb52e';ctx.fillRect(19,101,94*fuel/100,8);
  txt('Jetpack',120,112,16,'#fff5e6','left');
  if(goldT>0){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(18,118,96,10);ctx.fillStyle='#ffd23a';ctx.fillRect(19,119,94*goldT/1200,8);txt('Dourado',120,130,16,'#ffe07a','left')}
  if(L.boss){
    if(boss&&!boss.gone){
      const bw=300,bx=W/2-bw/2,by=42;
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bx-3,by-3,bw+6,16);
      ctx.fillStyle=boss.hp<=boss.max/2?'#ff7a2e':'#ff4d4d';ctx.fillRect(bx,by,bw*Math.max(0,boss.hp)/boss.max,10);
      txt(boss.cfg.name,W/2,by-9,16,'#ffe14a');
    }
  } else {
    for(let i=0;i<5;i++){const got2=frags[i]&&frags[i].got;ctx.save();ctx.translate(W/2-60+i*30,26);ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(8,0);ctx.lineTo(0,11);ctx.lineTo(-8,0);ctx.closePath();if(got2){ctx.fillStyle='#b36bff';ctx.fill();ctx.strokeStyle='#fff'}else{ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();ctx.strokeStyle='rgba(200,170,255,.5)'}ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}
  }
  const bw=150,bx=W-bw-24,by=26;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx,by,bw,8);
  const pr=Math.max(0,Math.min(1,P.x/GOALX));ctx.fillStyle='#ff9a5c';ctx.fillRect(bx,by,bw*pr,8);
  ctx.fillStyle='#fafaff';ctx.beginPath();ctx.arc(bx+bw*pr,by+4,7,0,7);ctx.fill();
  ctx.fillStyle='#ff5a4e';ctx.fillRect(bx+bw-3,by-4,6,16);
}
function overlay(){
  const dim=a=>{ctx.fillStyle=`rgba(16,6,31,${a})`;ctx.fillRect(0,0,W,H)};
  if(msgT>0&&state==='play'){ctx.globalAlpha=Math.min(1,msgT/20);txt(msgS,W/2,100,22,'#d9a8ff');ctx.globalAlpha=1}
  if(introT>0&&state==='play'){
    ctx.globalAlpha=Math.min(1,introT/30);
    txt(`Fase ${lv+1}`,W/2,170,46,'#ffb36b');txt(L.name,W/2,208,26,'#5ff5e8');
    if(L.boss){txt('Derrote o '+BOSSES[L.boss].name+'!',W/2,242,20,'#ff7a6a');if(L.boss==='duck')txt('A gosma gruda e tira uma vida. Desvie dela!',W/2,270,18,'#b6ff7a')}
    else txt('Ache os 5 fragmentos roxos',W/2,242,20,'#d9a8ff');
    ctx.globalAlpha=1;
  }
  if(state==='over'){
    dim(.65);txt('Fim de jogo',W/2,190,56,'#ff7a6a');txt(`Fase ${lv+1} · Cristais: ${got}/${total}`,W/2,238,24,'#5ff5e8');
    ctx.globalAlpha=.6+.4*Math.sin(tick*.08);txt('Toque para tentar a fase de novo',W/2,300,22,'#ffe07a');ctx.globalAlpha=1;
  } else if(state==='win'){
    dim(.6);
    if(lv<LV.length-1){txt(L.boss?'Chefão derrotado!':'Fase concluída!',W/2,180,56,'#ffb36b');txt(`Cristais: ${got}/${total}`,W/2,230,26,'#5ff5e8');ctx.globalAlpha=.6+.4*Math.sin(tick*.08);txt('Toque para a próxima fase',W/2,300,22,'#ffe07a');ctx.globalAlpha=1}
    else{txt('Missão cumprida!',W/2,170,56,'#ffb36b');txt('Você derrotou o Rei Pato!',W/2,214,24,'#ffe14a');txt(`Cristais: ${got}/${total}`,W/2,252,24,'#5ff5e8');ctx.globalAlpha=.6+.4*Math.sin(tick*.08);txt('Toque para jogar de novo',W/2,310,22,'#ffe07a');ctx.globalAlpha=1}
  }
}
function draw(){
  ctx.setTransform(.5,0,0,.5,0,0);ctx.imageSmoothingEnabled=false;
  if(state==='title'){drawTitle();post();return}
  if(state==='ending'){drawEnding();post();return}
  drawBG();
  ctx.save();ctx.translate(-Math.round(cam/2)*2,0);
  for(const c of clouds){if(Math.abs(c.x-(cam+W/2))<W)drawCloud(c)}
  if(L.boss==='duck')drawDuckDeco();
  for(const s of solids){if(s.x+s.w<cam-T||s.x>cam+W+T)continue;drawSolid(s)}
  if(L.boss==='duck')drawDuckPuddles();
  drawBeacon();
  if(!L.boss||bossDead)drawRocket();
  for(const f of frags)if(!f.got)drawFrag(f);
  if(gem)drawGem(gem);
  for(const c of coins){if(c.x<cam-20||c.x>cam+W+20)continue;drawCrystal(c)}
  for(const e of enemies){if(e.dead&&e.t<=0)continue;if(e.x<cam-60||e.x>cam+W+60)continue;drawEnemy(e)}
  for(const b of birds){if(Math.abs(b.x-(cam+W/2))<W)drawBird(b)}
  if(boss&&!boss.gone)drawBoss(boss);
  if(state!=='launch'&&state!=='win'){if(goldT>0)drawPlayerGold();else drawPlayer()}
  for(const l of lasers)drawLaser(l);
  for(const b of bullets)drawBullet(b);
  for(const g of globs)drawGlob(g);
  for(const d of drops){ctx.fillStyle='#b6ff3a';ctx.fillRect(d.x-1.5,d.y,3,10);ctx.fillStyle='#e8ffa0';ctx.fillRect(d.x-1.5,d.y,3,3)}
  for(const p of parts){ctx.globalAlpha=p.t/30;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
  ctx.restore();
  hud();overlay();post();
}
let last=performance.now(),accT=0;
function loop(t){accT+=Math.min(100,t-last);last=t;while(accT>=16.667){update();accT-=16.667}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
